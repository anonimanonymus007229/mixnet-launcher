[workspace]
members = ["crates/mixnet-core", "crates/mixnet-theme", "crates/mixnet-builder", "launcher"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { package = "gpui-fast", version = "=0.1.13" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.13" }

[profile.release]
opt-level = 2
strip = "debuginfo"
